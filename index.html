
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teclado Morse IoT</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(145deg, #d4eaff, #f0f9ff);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
}

.container {
    background: white;
    width: 100%;
    max-width: 650px;
    padding: 25px;
    border-radius: 22px;
    box-shadow: 0 10px 35px #34567833;
}

h1, .subtitle {
    text-align: center;
}

.subtitle {
    color: #668096;
}

.status {
    text-align: center;
    margin: 20px;
    font-weight: bold;
}

.display {
    background: #edf5fa;
    padding: 18px;
    border-radius: 12px;
    font-size: 22px;
    min-height: 65px;
    overflow-wrap: anywhere;
    text-align: center;
    letter-spacing: 2px;
}

.keyboard {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 7px;
    margin-top: 20px;
}

.key {
    padding: 13px 4px;
    border: none;
    border-radius: 9px;
    background: #dcecf8;
    font-weight: bold;
    cursor: pointer;
}

.key:hover {
    background: #a9d1ee;
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 20px;
}

.action {
    padding: 14px;
    border: none;
    border-radius: 10px;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.send {
    background: #218b65;
}

.clear {
    background: #71869a;
}

.stop {
    background: #bd3434;
    grid-column: span 2;
}

.action:disabled {
    opacity: .4;
    cursor: not-allowed;
}

button {
    transition: .2s;
}

button:active:not(:disabled) {
    transform: scale(.96);
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #aac4d8;
    margin-top: 10px;
}

@media(max-width:450px) {
    .keyboard {
        grid-template-columns: repeat(5, 1fr);
    }
}
</style>
</head>

<body>

<div class="container">

<h1>📡 Teclado Morse IoT</h1>

<p class="subtitle">
Arduino Uno · HiveMQ · Código Morse
</p>

<div class="status" id="status">
🟡 Conectando...
</div>

<div class="display" id="display">
Digite uma mensagem
</div>

<input
    id="texto"
    type="text"
    placeholder="Ou digite sua mensagem aqui"
    maxlength="40"
>

<div class="keyboard" id="keyboard"></div>

<div class="actions">

<button class="action clear" onclick="apagar()">
⌫ APAGAR
</button>

<button class="action clear" onclick="limpar()">
LIMPAR
</button>

<button class="action send" id="enviar" onclick="enviar()">
📡 TRANSMITIR
</button>

<button class="action stop" id="parar" onclick="parar()">
⏹ INTERROMPER
</button>

</div>

</div>

<script>

// ==========================================
// CONFIGURACOES
// ==========================================

const BROKER = "broker.hivemq.com";
const PORTA = 8884;
const CAMINHO = "/mqtt";

const TOPICO_BASE = "TesteVOS";
const TOPICO_TEXTO = TOPICO_BASE + "/texto";

let client;
let conectado = false;

let mensagem = "";

const letras = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const numeros = "0123456789";

// ==========================================
// TECLADO
// ==========================================

function criarTeclado() {

    const teclado = document.getElementById("keyboard");

    const caracteres = letras + numeros;

    for (const caractere of caracteres) {

        const botao = document.createElement("button");

        botao.className = "key";
        botao.textContent = caractere;

        botao.onclick = function() {
            adicionar(caractere);
        };

        teclado.appendChild(botao);
    }

    const espaco = document.createElement("button");

    espaco.className = "key";
    espaco.textContent = "ESPAÇO";
    espaco.style.gridColumn = "span 3";

    espaco.onclick = function() {
        adicionar(" ");
    };

    teclado.appendChild(espaco);
}

// ==========================================
// TEXTO
// ==========================================

function atualizarDisplay() {

    document.getElementById("display").textContent =
        mensagem || "Digite uma mensagem";

    document.getElementById("texto").value = mensagem;
}

function adicionar(letra) {

    if (mensagem.length < 40) {
        mensagem += letra;
        atualizarDisplay();
    }
}

function apagar() {

    mensagem = mensagem.slice(0, -1);

    atualizarDisplay();
}

function limpar() {

    mensagem = "";

    atualizarDisplay();
}

// ==========================================
// CONEXAO MQTT
// ==========================================

function conectar() {

    document.getElementById("status").textContent =
        "🟡 Conectando ao HiveMQ...";

    client = new Paho.MQTT.Client(
        BROKER,
        PORTA,
        CAMINHO,
        "morse_" + Math.random().toString(16).slice(2, 12)
    );

    client.onConnectionLost = function() {

        conectado = false;

        document.getElementById("status").textContent =
            "🔴 Conexão perdida";

        setTimeout(conectar, 5000);
    };

    client.connect({

        useSSL: true,

        onSuccess: function() {

            conectado = true;

            document.getElementById("status").textContent =
                "🟢 Conectado ao HiveMQ";

            console.log("MQTT conectado!");

        },

        onFailure: function(erro) {

            conectado = false;

            document.getElementById("status").textContent =
                "🔴 Falha de conexão";

            console.log(erro);

            setTimeout(conectar, 5000);
        }
    });
}

// ==========================================
// TRANSMISSAO
// ==========================================

function publicar(texto) {

    if (!conectado || !client) {
        alert("Conecte-se ao HiveMQ primeiro!");
        return false;
    }

    const mensagemMQTT = new Paho.MQTT.Message(texto);

    mensagemMQTT.destinationName = TOPICO_TEXTO;
    mensagemMQTT.qos = 0;

    client.send(mensagemMQTT);

    return true;
}

function enviar() {

    const campo = document.getElementById("texto");

    mensagem = campo.value.toUpperCase().trim();

    if (!mensagem) {
        alert("Digite uma mensagem!");
        return;
    }

    if (publicar(mensagem)) {
        console.log("Mensagem enviada:", mensagem);
        mensagem = "";
        atualizarDisplay();
    }
}

function parar() {

    publicar("STOP");

    console.log("Interrupção solicitada.");
}

// ==========================================
// INICIALIZACAO
// ==========================================

document.getElementById("texto").addEventListener(
    "input",
    function() {
        mensagem = this.value.toUpperCase();
        atualizarDisplay();
    }
);

criarTeclado();
atualizarDisplay();
conectar();

</script>

</body>
</html>
