
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Iluminação IoT</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(145deg, #d4eaff, #f0f9ff);
}

.container {
    width: 100%;
    max-width: 750px;
    padding: 30px;
    border-radius: 25px;
    background: rgba(255,255,255,0.8);
    box-shadow: 0 15px 40px #34567833;
}

h1 {
    text-align: center;
    color: #0b2b44;
}

.subtitle {
    text-align: center;
    color: #58738a;
    margin-bottom: 25px;
}

.status {
    text-align: center;
    margin: 20px 0;
    font-weight: bold;
    color: #d97706;
}

.topic-area {
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #aac4d8;
    border-radius: 12px;
    margin-top: 8px;
    font-size: 14px;
}

.led-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.led-card {
    background: #eaf3fa;
    padding: 20px 12px;
    border-radius: 18px;
    text-align: center;
}

.led-light {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    margin: 10px auto 15px;
    background: #bdcbd5;
    transition: 0.3s;
}

.led-light.active {
    background: #0088ff;
    box-shadow: 0 0 25px #0088ff, 0 0 50px #0088ff77;
}

.led-state {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 15px;
    color: #526879;
}

button {
    width: 100%;
    padding: 12px 8px;
    margin: 5px 0;
    border: none;
    border-radius: 12px;
    color: white;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover:not(:disabled) {
    filter: brightness(0.9);
    transform: scale(1.02);
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.btn-on {
    background: #218b65;
}

.btn-off {
    background: #bd6262;
}

.btn-all {
    background: #bd3434;
    max-width: 350px;
    display: block;
    margin: 25px auto 0;
    padding: 16px;
    font-size: 16px;
}

.footer {
    text-align: center;
    font-size: 12px;
    color: #71889b;
    margin-top: 25px;
}

@media(max-width: 560px) {
    .led-grid {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 20px 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>💡 Central de Iluminação</h1>

    <p class="subtitle">
        Sistema de Controle IoT - Arduino Uno
    </p>

    <div class="status" id="status">
        🟡 Conectando ao HiveMQ...
    </div>

    <div class="topic-area">
        <label for="topicInput">
            📡 Tópico MQTT (base)
        </label>

        <input
            type="text"
            id="topicInput"
            value="TesteVOS"
            spellcheck="false"
        >
    </div>

    <div class="led-grid">

        <!-- LED 1 -->

        <div class="led-card">

            <h3>LED 1</h3>
            <p>Pino 11</p>

            <div class="led-light" id="light1"></div>

            <div class="led-state" id="state1">
                DESLIGADO
            </div>

            <button class="btn-on"
                onclick="enviarComando('LED1_ON')"
                disabled>
                LIGAR
            </button>

            <button class="btn-off"
                onclick="enviarComando('LED1_OFF')"
                disabled>
                DESLIGAR
            </button>

        </div>

        <!-- LED 2 -->

        <div class="led-card">

            <h3>LED 2</h3>
            <p>Pino 12</p>

            <div class="led-light" id="light2"></div>

            <div class="led-state" id="state2">
                DESLIGADO
            </div>

            <button class="btn-on"
                onclick="enviarComando('LED2_ON')"
                disabled>
                LIGAR
            </button>

            <button class="btn-off"
                onclick="enviarComando('LED2_OFF')"
                disabled>
                DESLIGAR
            </button>

        </div>

        <!-- LED 3 -->

        <div class="led-card">

            <h3>LED 3</h3>
            <p>Pino 13</p>

            <div class="led-light" id="light3"></div>

            <div class="led-state" id="state3">
                DESLIGADO
            </div>

            <button class="btn-on"
                onclick="enviarComando('LED3_ON')"
                disabled>
                LIGAR
            </button>

            <button class="btn-off"
                onclick="enviarComando('LED3_OFF')"
                disabled>
                DESLIGAR
            </button>

        </div>

    </div>

    <!-- BOTAO GERAL -->

    <button class="btn-all"
        onclick="enviarComando('TODOS_OFF')"
        disabled>
        ⏻ DESLIGAR TODOS OS LEDs
    </button>

    <div class="footer">
        Comunicação MQTT · HiveMQ · Arduino Uno
    </div>

</div>

<script>

// ==========================================
// 1. CONFIGURACOES MQTT
// ==========================================

const BROKER = "broker.hivemq.com";
const PORTA = 8884;
const CAMINHO = "/mqtt";

let client = null;
let conectado = false;

const topicInput = document.getElementById("topicInput");

let topicoBase = topicInput.value.trim();

let topicoComando = topicoBase + "/command";
let topicoStatus = topicoBase + "/status";

// ==========================================
// 2. ELEMENTOS DA INTERFACE
// ==========================================

const botoes = document.querySelectorAll("button");

const statusSistema = document.getElementById("status");

// ==========================================
// 3. STATUS DE CONEXAO
// ==========================================

function atualizarConexao(estado, mensagem) {

    conectado = estado;

    statusSistema.textContent = mensagem;

    botoes.forEach(botao => {
        botao.disabled = !estado;
    });
}

// ==========================================
// 4. ATUALIZACAO DOS LEDS
// ==========================================

function atualizarLEDs(estados) {

    for (let i = 1; i <= 3; i++) {

        const ligado = estados["led" + i];

        const luz = document.getElementById("light" + i);
        const texto = document.getElementById("state" + i);

        if (ligado) {

            luz.classList.add("active");
            texto.textContent = "LIGADO";

        } else {

            luz.classList.remove("active");
            texto.textContent = "DESLIGADO";

        }
    }
}

// ==========================================
// 5. CONEXAO COM HIVEMQ
// ==========================================

function conectarMQTT() {

    atualizarConexao(false, "🟡 Conectando ao HiveMQ...");

    const clientId =
        "github_led_" +
        Math.random().toString(16).substring(2, 12);

    client = new Paho.MQTT.Client(
        BROKER,
        PORTA,
        CAMINHO,
        clientId
    );

    client.onConnectionLost = function(response) {

        atualizarConexao(false, "🔴 Conexão perdida");

        console.log("Conexão perdida:", response.errorMessage);

        setTimeout(conectarMQTT, 5000);
    };

    client.onMessageArrived = function(message) {

        if (message.destinationName !== topicoStatus) {
            return;
        }

        try {

            const estados = JSON.parse(message.payloadString);

            atualizarLEDs(estados);

            console.log("Estados atualizados:", estados);

        } catch (erro) {

            console.error("Erro ao interpretar status:", erro);

        }
    };

    client.connect({

        useSSL: true,

        timeout: 10,

        onSuccess: function() {

            console.log("Conectado ao HiveMQ!");

            atualizarConexao(true, "🟢 Sistema Online");

            client.subscribe(topicoStatus);

        },

        onFailure: function(erro) {

            atualizarConexao(false, "🔴 Falha na conexão");

            console.log("Erro MQTT:", erro);

            setTimeout(conectarMQTT, 5000);
        }
    });
}

// ==========================================
// 6. ENVIO DOS COMANDOS
// ==========================================

function enviarComando(comando) {

    if (!client || !conectado) {

        alert("Sistema desconectado do HiveMQ!");

        return;
    }

    const mensagem = new Paho.MQTT.Message(comando);

    mensagem.destinationName = topicoComando;
    mensagem.qos = 0;

    client.send(mensagem);

    console.log("Comando enviado:", comando);
}

// ==========================================
// 7. INICIALIZACAO
// ==========================================

atualizarLEDs({
    led1: false,
    led2: false,
    led3: false
});

conectarMQTT();

</script>

</body>
</html>
